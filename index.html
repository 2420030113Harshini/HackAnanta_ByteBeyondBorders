
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIXORA - Civic Intelligence Grid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
    
    :root {
      --bg-color: #030014;
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent-purple: #9d72ff;
      --text-main: #f8fafc;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(79, 70, 229, 0.05) 0%, transparent 50%),
        radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px;
      overflow-x: hidden;
    }

    .glass-card {
      background: rgba(13, 2, 33, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(157, 114, 255, 0.2);
      border-radius: 10px;
    }
    
    @keyframes emergency-pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
    }

    @keyframes cinematic-emergency-pulse {
      0% { border-color: #000; box-shadow: 0 0 10px #000; }
      50% { border-color: #ff0000; box-shadow: 0 0 40px rgba(255, 0, 0, 0.8); }
      100% { border-color: #000; box-shadow: 0 0 10px #000; }
    }

    .cinematic-emergency {
      animation: cinematic-emergency-pulse 2s infinite ease-in-out;
    }

    .emergency-pulse {
      animation: emergency-pulse 1.5s infinite;
      border-radius: 50%;
    }

    .cluster {
      background-color: #9d72ff;
      border: 2px solid white;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(157, 114, 255, 0.5);
    }
  </style>
